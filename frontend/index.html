<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Water Billing Platform</title>

  <style>
    /* ============================================================
       Hide Google Translate Top Banner Safely without Breaking Script
       ============================================================ */

    /* Hide the top banner frame by pushing it off-screen */
    .goog-te-banner-frame,
    .goog-te-banner-frame.skiptranslate,
    iframe.goog-te-banner-frame,
    .VIpgJd-yA0fcB-VIpgJd-m52hhb,
    .VIpgJd-yA0fcB-a-s,
    iframe[id*=":1.container"],
    iframe[id*=":2.container"] {
      display: none !important;
      visibility: hidden !important;
      transform: translateY(-1000px) !important;
      position: absolute !important;
      top: -9999px !important;
      left: -9999px !important;
      width: 0 !important;
      height: 0 !important;
    }

    /* Prevent body from shifting down when Google translates */
    html,
    body,
    body.translated-ltr,
    body.translated-rtl {
      top: 0px !important;
      margin-top: 0px !important;
      padding-top: 0px !important;
      position: static !important;
    }

    /* Hide Google hover tooltips & highlights */
    #goog-gt-tt,
    .goog-tooltip,
    .goog-tooltip:hover,
    .goog-te-balloon-frame,
    .VIpgJd-yA0fcB-r4n21b {
      display: none !important;
      visibility: hidden !important;
    }

    .goog-text-highlight {
      background-color: transparent !important;
      box-shadow: none !important;
      border: none !important;
    }

    /* Hide the default initialization container */
    #google_translate_element {
      position: absolute !important;
      top: -9999px !important;
      left: -9999px !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <!-- Hidden container for Google Translate engine -->
  <div id="google_translate_element"></div>

  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        {
          pageLanguage: 'en',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        },
        'google_translate_element'
      );
    }

    // Keep body top position fixed at 0 without deleting elements
    const observer = new MutationObserver(() => {
      if (document.body && document.body.style.top !== '0px') {
        document.body.style.top = '0px';
      }
      if (document.body && document.body.style.marginTop !== '0px') {
        document.body.style.marginTop = '0px';
      }
    });

    observer.observe(document.documentElement, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ['style', 'class']
    });
  </script>

  <!-- Google Translate Engine -->
  <script
    type="text/javascript"
    src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit">
  </script>

  <!-- React Main -->
  <script type="module" src="/src/main.jsx"></script>

  <!-- Razorpay -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</body>
</html>
